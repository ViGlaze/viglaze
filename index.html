<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURE NOW | Next-Gen Transparent Video Facades & Automotive Glazing R&D</title>
    <meta name="description" content="Secure portal for the $43M architectural video facade and automotive smart glazing R&D portfolio. Review core US Patent licensing documentation and technical briefs for continuous glazed structures up to 8,000 sq.m.">
    <meta name="keywords" content="Video Facade, Video Arch Net, Architecture TV, Smart Glazing, Automotive Glass HUD, US Patent Glass Media, Structural Glazing R&D">
    <style>
        :root {
            --bg-dark-grey: #2d3748; /* Darkish Grey background */
            --bg-card: #1a202c;
            --glaze-blue: #eef5fc;
            --glaze-blue-accent: #3a86c8;
            --struct-gray-light: #f4f6f9;
            --struct-gray-text: #cbd5e0;
            --struct-gray-dark: #1a202c;
            --corp-purple: #6b21a8;
            --corp-purple-hover: #581c87;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark-grey);
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #1a202c;
            border-bottom: 2px solid rgba(58, 134, 200, 0.2);
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .hero {
            position: relative;
            background: linear-gradient(rgba(45, 55, 72, 0.8), rgba(26, 32, 44, 0.95)), url('my-background.png') no-repeat center center/cover;
            padding: 100px 5%;
            text-align: center;
            border-bottom: 4px solid var(--corp-purple);
        }

        .hero h1 {
            font-size: 48px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            max-width: 800px;
            margin: 0 auto 30px auto;
            color: var(--struct-gray-text);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .metric-card {
            background-color: var(--bg-card);
            border: 1px solid var(--glaze-blue-accent);
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .metric-card h3 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .metric-card p {
            color: var(--struct-gray-text);
        }

        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .split-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 60px;
        }

        @media (max-width: 768px) {
            .split-section {
                grid-template-columns: 1fr;
            }
        }

        .split-text h2 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .split-text p {
            color: var(--struct-gray-text);
            margin-bottom: 20px;
        }

        .split-image img {
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .integration-focus-box {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 8px;
            margin: 40px 0;
        }

        .integration-focus-box h3 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .integration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .integration-grid {
                grid-template-columns: 1fr;
            }
        }

        .integration-item {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 6px;
            border-left: 4px solid var(--glaze-blue-accent);
        }

        .integration-item h4 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .integration-item p {
            font-size: 15px;
            color: var(--struct-gray-text);
            margin: 0;
        }

        .gateway-box {
            background-color: var(--bg-card);
            border-left: 6px solid var(--corp-purple);
            padding: 40px;
            border-radius: 0 8px 8px 0;
            margin-top: 60px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gateway-box h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }

        .gateway-box p {
            color: var(--struct-gray-text);
        }

        .btn-secure {
            display: inline-block;
            background-color: var(--corp-purple);
            color: #ffffff;
            padding: 18px 40px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s ease;
            cursor: pointer;
            border: none;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(107, 33, 168, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }

        .btn-secure:hover {
            background-color: var(--corp-purple-hover);
        }

        /* --- NDA POPUP STYLES --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #1a202c;
            width: 100%;
            max-width: 700px;
            border-radius: 8px;
            border-top: 8px solid var(--corp-purple);
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--struct-gray-text);
            cursor: pointer;
        }

        .nda-text-area {
            background: #2d3748;
            border: 1px solid #4a5568;
            padding: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #e2e8f0;
            height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: justify;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--glaze-blue-accent);
            background-color: #2d3748;
            color: #ffffff;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-submit-nda {
            width: 100%;
            background-color: var(--corp-purple);
            color: white;
            border: none;
            padding: 14px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit-nda:hover {
            background-color: var(--corp-purple-hover);
        }

        footer {
            background-color: #1a202c;
            text-align: center;
            padding: 30px;
            color: var(--struct-gray-text);
            font-size: 14px;
            border-top: 1px solid rgba(58, 134, 200, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">FUTURE NOW</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>FUTURE NOW</h1>
            <p>Completing the final stages of R&D to deliver structural transparent video glazing media and advanced glazing systems for architectural and automotive scaling.</p>
            
            <div class="metrics-grid">
                <div class="metric-card">
